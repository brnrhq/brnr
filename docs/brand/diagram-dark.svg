<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 476" width="960" height="476" role="img" aria-labelledby="title desc">
<title id="title">brnr's architecture</title>
<desc id="desc">An optional editor's session: the editor runs brnr acp over stdio, and brnr acp, which only relays bytes, is joined to the brnr process by socketpairs. The brnr process owns the agent (Claude Code, Codex, any ACP agent) and talks to it over pipes. A headless session has no editor and no brnr acp. Below the brnr process is its control socket, a Unix socket only you can open. You reach it from a terminal (brnr prompt send, brnr event watch, and the other commands), and another agent reaches it through the same commands and brnr's skill. Bridges, such as Slack or push notifications, are started by a profile and talk to the brnr process over pipes.</desc>
