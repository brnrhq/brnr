# Checks the formatting, lints and tests every pull request and every push to
# main, on Linux and macOS, and lints on aarch64 Linux too. The integration
# tests drive the real binary against tests/fake_agent.py, so they need
# python3 (both runners have it).
# The adapters are built and checked with brnr too (stand-in agents, so no
# credentials), so that a pull request moving their npm versions
# (Dependabot's) is tested; cargo deny checks the crates
# (deny.toml) and cargo vet that each is audited or exempted (supply-chain/);
# the code builds with the oldest Rust Cargo.toml says it does
# (rust-version); and what isn't Rust is linted: the workflows (actionlint,
# zizmor), the shell scripts (shellcheck) and the Python (ruff).
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --check
      - run: cargo clippy --release --all-targets -- -D warnings
      # A test that can't run here fails in CI (`skip`, tests/common), and the
      # network test needs lsof: macOS has it, the Linux image may not.
      - if: runner.os == 'Linux'
        run: command -v lsof || { sudo apt-get update && sudo apt-get install -y lsof; }
      # Release, as locally: some tests stream tens of thousands of events.
      - run: cargo test --release
      # another_user_cant_connect needs root, to connect as nobody: B1's
      # kernel side (docs/threat-model.md). Built as the runner, run as root:
      # cargo as root leaves root's files in target/, which the cache can't
      # save. CI stays set (-E), so a check in it that can't run fails, and
      # the grep fails a run of no test. TMPDIR: user nobody can reach /tmp.
      - name: The test that needs root, as root
        if: runner.os == 'Linux'
        shell: bash
        env:
          TMPDIR: /tmp
        run: |
          bin=$(cargo test --release --test security --no-run --message-format=json \
            | jq -r 'select(.target.name == "security" and .executable) | .executable')
          sudo -E "$bin" --ignored --exact another_user_cant_connect | tee "$RUNNER_TEMP/root.txt"
          grep -qxF 'test another_user_cant_connect ... ok' "$RUNNER_TEMP/root.txt"
      - name: ADR claim inventory
        run: |
          python3 .github/scripts/test_adr_tests.py
          python3 .github/scripts/adr-tests.py

  # Lints on aarch64 Linux too, where c_char is u8, not i8: a cast that is
  # needed on the other runners is one clippy flags there (issue 79).
  clippy-arm:
    timeout-minutes: 20
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo clippy --release --all-targets -- -D warnings

  # With brnr, so a pin that breaks it (doctor, session list, a fork) fails
  # here, not in the nightly canary after the pull request is merged.
  adapters:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # check.py itself first, against stub adapters.
      - run: adapters/test_check.py
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: cargo build --release
      # Next to brnr, as Homebrew installs them, outside target/ (cached).
      - run: |
          adapters/build.sh "$RUNNER_TEMP/adapters"
          cp target/release/brnr "$RUNNER_TEMP/adapters/"
      - run: adapters/check.py --brnr "$RUNNER_TEMP/adapters"

  deny:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

  vet:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      # Pinned, as the linters are; --locked builds it from its own Cargo.lock.
      - run: cargo install --locked cargo-vet --version 0.10.2
      # --locked: the imported audits are the ones in supply-chain/imports.lock,
      # not whatever the importers publish today.
      - run: cargo vet --locked

  msrv:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: msrv
        run: echo "version=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo check --locked --all-targets

  lint:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The linters' own versions are pinned, so a new release's checks
      # arrive in a pull request that moves the pin, not as a red main.
      - uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
        with:
          version: 1.7.12
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          version: 1.30.1
          advanced-security: false
          annotations: true
      - run: shellcheck release.sh adapters/build.sh .clusterfuzzlite/build.sh .github/scripts/*.sh tests/flake-loop.sh
      - uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          version: 0.15.10
          args: check
      - uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          version: 0.15.10
          args: format --check
