# Runs the OpenSSF Scorecard checks (https://scorecard.dev) on main every
# week, on every push to main and whenever branch protection changes, and
# uploads what they find to the repository's code scanning alerts. The results
# are also published to the Scorecard API, which the README badge reads: that
# needs the OIDC token (id-token: write), and Scorecard only accepts results
# from a workflow that runs nothing but its allowed actions, so this one has
# no run steps.
name: scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: "30 4 * * 1"
  # The Branch-Protection check reads the rules: rescore when they change.
  branch_protection_rule:

permissions:
  contents: read

jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      # The SARIF upload to code scanning.
      security-events: write
      # publish_results proves which repository and workflow the results come from.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: results.sarif
