# On a version tag: publish a GitHub release and point the Homebrew formulae
# in brnrhq/homebrew-tap at it: brnr, and one formula per adapter, which
# builds adapters/ from the same source. An adapter formula's version is its
# npm package's (from adapters/package.json), so `brew upgrade` rebuilds an
# adapter when that changes, not on every brnr release. The tap is pushed to with a deploy key whose
# private half is the HOMEBREW_TAP_DEPLOY_KEY secret.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check the tag matches Cargo.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $version" >&2
            exit 1
          fi

      - name: Build and test
        run: cargo test --release && cargo build --release

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"

      - uses: actions/checkout@v5
        with:
          repository: brnrhq/homebrew-tap
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          path: tap

      - name: Update the formulae
        run: |
          url="https://github.com/$GITHUB_REPOSITORY/archive/refs/tags/$GITHUB_REF_NAME.tar.gz"
          sha256=$(curl -fsSL "$url" | sha256sum | cut -d' ' -f1)
          python3 - "$url" "$sha256" <<'PY'
          import json, re, sys
          url, sha256 = sys.argv[1:]
          deps = json.load(open("adapters/package.json"))["dependencies"]
          formulae = {
              "brnr": None,
              "brnr-claude-adapter": deps["@agentclientprotocol/claude-agent-acp"],
              "brnr-codex-adapter": deps["@agentclientprotocol/codex-acp"],
          }
          for name, version in formulae.items():
              path = f"tap/Formula/{name}.rb"
              formula = open(path).read()
              formula = re.sub(r'\n  (url|sha256|version) "[^"]*"', "", formula)
              lines = f'\n  url "{url}"'
              if version:
                  lines += f'\n  version "{version}"'
              lines += f'\n  sha256 "{sha256}"'
              formula = re.sub(r'(\n  homepage "[^"]*")', lambda m: m.group(1) + lines, formula)
              open(path, "w").write(formula)
          PY
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "brnr ${GITHUB_REF_NAME#v}"
          git push
