# On a version tag: publish a GitHub release with the source as an asset
# (brnr-X.tar.gz, made with git archive and attested with build provenance),
# and point the Homebrew formulae in brnrhq/homebrew-tap at that asset: brnr,
# and one formula per adapter, which builds adapters/ from the same source.
# The asset rather than GitHub's generated archive, so what users build from
# is attested and its downloads are counted. An adapter formula's version is
# its npm package's (from adapters/package.json), so `brew upgrade` rebuilds
# an adapter when that changes, not on every brnr release. The tap is pushed
# to with a deploy key whose private half is the HOMEBREW_TAP_DEPLOY_KEY
# secret. Then the crates job publishes the crate to crates.io (ADR 47) with
# trusted publishing: crates.io trusts this workflow in the crates-io
# environment, and the job trades GitHub's OIDC token for a short-lived
# crates.io token. No token is stored.
name: release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # the release and its asset
      id-token: write # the attestation's signing certificate
      attestations: write # storing the attestation
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The toolchain CI tests with, rather than whatever the runner has.
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable

      - name: Check the tag matches Cargo.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $version" >&2
            exit 1
          fi

      - name: Build and test
        run: cargo test --release && cargo build --release

      # Before anything is public: a published version can't be replaced.
      - name: Check the crate packages
        run: cargo publish --dry-run --locked

      # Under brnr-X/, the prefix GitHub's archive has, which the formulae
      # were written against.
      - name: Make the source tarball
        id: tarball
        run: |
          name="brnr-${GITHUB_REF_NAME#v}"
          git archive --format=tar.gz --prefix="$name/" -o "$name.tar.gz" HEAD
          echo "path=$name.tar.gz" >> "$GITHUB_OUTPUT"

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.tarball.outputs.path }}

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TARBALL: ${{ steps.tarball.outputs.path }}
        run: gh release create "$GITHUB_REF_NAME" "$TARBALL" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"

      # Its credentials (the deploy key) stay, for the push below.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # zizmor: ignore[artipacked]
        with:
          repository: brnrhq/homebrew-tap
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          path: tap

      - name: Update the formulae
        env:
          TARBALL: ${{ steps.tarball.outputs.path }}
        run: |
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/$TARBALL"
          sha256=$(sha256sum "$TARBALL" | cut -d' ' -f1)
          python3 - "$url" "$sha256" <<'PY'
          import json, re, sys
          url, sha256 = sys.argv[1:]
          deps = json.load(open("adapters/package.json"))["dependencies"]
          formulae = {
              "brnr": None,
              "brnr-claude-adapter": deps["@agentclientprotocol/claude-agent-acp"],
              "brnr-codex-adapter": deps["@agentclientprotocol/codex-acp"],
          }
          for name, version in formulae.items():
              path = f"tap/Formula/{name}.rb"
              formula = open(path).read()
              # A new npm version starts the adapter's revisions over.
              old = re.search(r'\n  version "([^"]*)"', formula)
              if version and old and old.group(1) != version:
                  formula = re.sub(r'\n  revision \d+', "", formula)
              formula = re.sub(r'\n  (url|sha256|version) "[^"]*"', "", formula)
              lines = f'\n  url "{url}"'
              if version:
                  lines += f'\n  version "{version}"'
              lines += f'\n  sha256 "{sha256}"'
              formula = re.sub(r'(\n  homepage "[^"]*")', lambda m: m.group(1) + lines, formula)
              open(path, "w").write(formula)
          PY
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "brnr ${GITHUB_REF_NAME#v}"
          git push

  crates:
    needs: release
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      id-token: write # traded for a crates.io token
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable
      # Revoked when the job ends.
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
