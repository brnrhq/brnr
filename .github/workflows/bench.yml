# What `brnr acp` adds (ADR 1, N3), on every pull request: `cargo bench
# --bench acp`, on Linux and macOS, fails when a number passes its budget
# (benches/budgets.toml). Its numbers go into the run's summary and into one
# comment on the pull request, updated on each push. The comment needs a
# token that can write, which a pull request from a fork or from Dependabot
# doesn't get: its numbers are in the summary only.
name: bench

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bench:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo bench --locked --bench acp -- --markdown "$RUNNER_TEMP/bench.md"
      # Over budget too: the numbers say by how much.
      - if: always()
        run: |
          if [ -f "$RUNNER_TEMP/bench.md" ]; then
            cat "$RUNNER_TEMP/bench.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-${{ runner.os }}
          path: ${{ runner.temp }}/bench.md
          if-no-files-found: ignore

  comment:
    needs: bench
    # Dependabot's pull requests get a token that can't write either.
    if: >-
      always()
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.user.login != 'dependabot[bot]'
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bench-*
          path: bench
      # One comment, found by its first line, and edited from then on.
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          RESULT: ${{ needs.bench.result }}
        run: |
          marker='<!-- brnr-bench -->'
          {
            echo "$marker"
            echo "### What \`brnr acp\` adds"
            echo
            echo "At $SHA: $RESULT. Budgets: \`benches/budgets.toml\` (ADR 1, N3)."
            for file in bench/*/bench.md; do
              [ -f "$file" ] || continue
              echo
              cat "$file"
            done
          } > comment.md
          id=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" \
            | head -n 1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -F body=@comment.md > /dev/null
          else
            gh api "repos/$REPO/issues/$PR/comments" -F body=@comment.md > /dev/null
          fi
