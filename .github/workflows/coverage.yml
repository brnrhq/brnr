# Coverage is informational while we learn the baseline. Keep each run's
# summary and HTML report so main's history shows the trend without a service
# token, a percentage gate, or a badge suggesting a target we haven't chosen.
name: coverage

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: coverage
      - run: cargo install --locked cargo-llvm-cov --version 0.9.1
      # Runs unit and integration tests, with CARGO_BIN_EXE_brnr instrumented
      # too. Children inherit LLVM_PROFILE_FILE (including its process id).
      - run: cargo llvm-cov --locked --release --all-targets --no-report
      - name: Summarize coverage
        run: |
          cargo llvm-cov report --release --ignore-filename-regex '/tests/' > coverage.txt
          {
            echo '## Rust coverage (Linux, release)'
            echo
            echo 'Informational only; no coverage threshold. Unit and integration tests run the instrumented binary.'
            echo 'The table reports line, region, and function coverage, not branch coverage; TOTAL is the overall baseline.'
            echo 'Profiles from processes killed by a signal or exiting through _exit can be missing.'
            echo 'Compare main runs for the trend; download the coverage artifact for uncovered source lines.'
            echo
            echo '```text'
            cat coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Render uncovered lines
        run: cargo llvm-cov report --release --ignore-filename-regex '/tests/' --html
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: |
            coverage.txt
            target/llvm-cov/html/
          if-no-files-found: error
          retention-days: 90
