[[audits.foldhash]]
who = "Automated source review (Claude Opus 5.5)"
criteria = "safe-to-deploy"
version = "0.2.0"
notes = "Automated full source review of all packaged src/ files (lib.rs, fast.rs, quality.rs, seed.rs, convenience.rs) and the manifest; no build script and no dependencies. Unsafe code is the unaligned u64 read in load(), the hash_bytes_long call for inputs over 16 bytes, the Sync impl of the global seed storage, and its write and read. Every load was checked to end within the slice: the >256-byte loop reads at most v[..96], the >128-byte loop v[..64], and the tail, entered with 16 < len <= 128 or 64 < len <= 128, reads offsets 0..64 and len-64..len only behind the matching len checks. The seed is written once after an Acquire compare-exchange from UNINIT to LOCKED and published with a Release store of INIT; it is read only through GlobalSeed, whose sole constructor returns after observing or storing INIT. The sponge shift in write_num stays below 128 bits. The per-process seed does not come from an OS random source: it mixes the addresses of a stack variable, a function, a static and a heap allocation (ASLR) with the system time, and per-hasher seeds mix a stack address with a thread-local counter. As the crate says, the hash is non-cryptographic and only minimally DoS-resistant; an attacker who can learn or guess those values can craft colliding keys. No filesystem, network, env, process or FFI; the only ambient access is reading the clock."

[[audits.indexmap]]
who = "Automated source review (GPT-6)"
criteria = "safe-to-deploy"
delta = "2.14.0 -> 2.14.2"
notes = "Reviewed the compiled source and manifest delta against the imported audited version. Both disjoint mutable-access helpers validate all bounds and duplicate indices before deriving references from the exclusive slice pointer; no mutation occurs between checks and pointer use. Optional missing keys produce None. Bucket projections split distinct key/value fields. Index operations retain explicit checked bounds; same-key equality uses Eq. Empty-map macros use the existing safe const constructor. No new ambient I/O. Dependencies require separate coverage."

[[audits.itoa]]
who = "Automated source review (Claude Opus 5.5)"
criteria = "safe-to-deploy"
version = "1.0.18"
notes = "Automated full source review of all packaged src/ files (lib.rs, u128_ext.rs) and the manifest; no build script, no_std, no default dependencies. Unsafe code is unchecked DECIMAL_PAIRS indexing, a cast of the 40-byte buffer to the sealed per-type array and from_utf8_unchecked on the written tail. Pair indices stay below 100 because every divmod100 input is below 10000, including the 1e16 split of u128, whose multiply-shift constant was checked to give an exact quotient for every u128 (M*1e16 - 2^179 < 2^51). The written region is contiguous, every write is bounds-checked, and it holds only ASCII digits and '-'. No filesystem, network, process, env, FFI or asm."

