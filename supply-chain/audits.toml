[[audits.toml]]
who = "Automated source review (Claude Opus 5.5)"
criteria = "safe-to-deploy"
delta = "1.1.6+spec-1.1.0 -> 1.1.8+spec-1.1.0"
notes = "Automated review of the complete crates.io delta. The document serializer now writes table and array-of-tables header keys and enum variant names through toml_writer's ToTomlKey, which quotes and escapes them, instead of raw; Table deserialization now rejects duplicate keys, as Value already did; unused prefix/suffix span tracking is removed from the inline-table parser. Dependency bounds move to the sibling releases reviewed in this file; dev-dependencies, lints and metadata change. The crate still forbids unsafe code; no build script or I/O. The delta does not change nesting: toml_parser 1.1.5 keeps the same depth limits, so the stack overflow on deeply nested tables recorded for 1.1.6 in supply-chain/README.md remains in 1.1.8, and the 1.1.6 base stays exempted, not certified."

