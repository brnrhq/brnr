[[audits.serde_json]]
who = "Automated source review (Claude Opus 5.5)"
criteria = "safe-to-deploy"
delta = "1.0.151 -> 1.0.154"
notes = "Automated review of the complete crates.io delta against the exempted 1.0.151: manifests, Cargo.lock, CI and src/de.rs, lexical/math.rs, lib.rs, map.rs, number.rs and read.rs, plus tests. build.rs is unchanged. preserve_order now enables alloc and an optional foldhash 0.2 dependency (default features off) instead of std, and indexmap is used without default features. Map is now IndexMap with an explicit hasher: std's RandomState when std is on, as before, and foldhash::fast::RandomState only without std, so std builds keep the same HashDoS-resistant hashing. The arbitrary_precision parser keeps -0 as a float. as_f32 returns None for floats out of f32 range, which changes Value == f32 comparison only. Invalid UTF-8 errors now report the first bad byte's position; the new index and column arithmetic is bounded (valid_up_to is below the slice length, begin_raw_buffering runs after whitespace so a peeked byte is never a newline, saturating_sub elsewhere). Recursion, the depth limit and unbounded_depth are unchanged. No new unsafe code, FFI or ambient I/O. Dependencies require separate coverage."

