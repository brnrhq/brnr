
# cargo-vet audits file

[[audits.android_system_properties]]
who = "Automated source review (GPT-6)"
criteria = "safe-to-deploy"
delta = "0.1.5 -> 0.1.6"
notes = "Automated review of the complete crates.io delta and callback caller. The callback now has the C ABI, receives a pointer to a live Option<String>, returns None for invalid UTF-8 and uses the actual void-returning read_callback signature from Android bionic sys/system_properties.h. The result stays alive for the synchronous callback call; existing CStr/dynamic-library boundaries are unchanged. The old getter only gains a safety comment. Metadata changes add no build script. Header checked at https://android.googlesource.com/platform/bionic/+/4782b4e08510d709a0e2867fc86c2f99ca776490/libc/include/sys/system_properties.h ."

