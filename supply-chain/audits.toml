
# cargo-vet audits file

[[audits.agent-client-protocol-schema]]
who = "Automated source review (Claude Opus 5.5)"
criteria = "safe-to-deploy"
delta = "1.10.2 -> 1.11.0"
notes = "Automated review of the complete crates.io delta against the exempted 1.10.2: both manifests, Cargo.lock and src/v1 and src/v2 agent.rs, client.rs and nes.rs. The crate has no build script. Dependencies and their features are unchanged; the unstable_session_notices and unstable_session_compaction features are removed and their Notice, CompactionUpdate, CompactionSummaryChunk and capability types become unconditional serde data types. Session-setup lists (mcpServers, additionalDirectories), MCP server and terminal-auth args/env/headers, terminal create fields, read range bounds and NES content changes now use DefaultOnNull instead of DefaultOnError/VecSkipError, so a malformed value is an error rather than silently dropped. A terminal auth method that fails its schema no longer falls back to the agent variant; the fallback deserializes the already-buffered value once more into serde_json::Value, with the same depth as the input and no new recursion. Behind unstable_subagents and unstable_protocol_v2, stop reasons become tagged enums with an error variant and an OtherStopReason that keeps extra fields in a BTreeMap. Schemars transforms only edit generated schemas. No unsafe code, FFI, file, network, environment or process access is added; the new code is safe serde data handling and tests."

