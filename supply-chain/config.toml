[[exemptions.zmij]]
version = "1.0.23"
criteria = "safe-to-deploy"
notes = "Automated review (Claude Opus 5.5) of version 1.0.23; not a person's audit: Read all packaged src/ files (lib.rs, traits.rs, stdarch_x86.rs, cfg(test) tests.rs), build.rs and the manifest; no_std, no default dependencies. Unsafe code is unchecked indexing into const-built power-of-10, exponent-shift, exponent-string and shuffle tables, raw-pointer writes into a 24-byte stack buffer followed by from_utf8_unchecked, SSE2/SSE4.1/NEON intrinsics gated by compile-time target_feature cfgs, and empty-comment asm! optimizer barriers. Index ranges were derived for every f32/f64 bit pattern, including NaN/inf passed to format_finite and subnormals; the largest write ends exactly at byte 24, and the digit arithmetic only produces bytes 0-9, so the output is ASCII. Aligned SIMD loads read u128 fields at 16-byte multiples of an align(64) struct. build.rs only runs `$RUSTC --version` and reads OPT_LEVEL to emit cfgs. No filesystem, network, env or FFI in the library."
