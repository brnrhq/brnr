[[exemptions.powerfmt]]
version = "0.2.1"
criteria = "safe-to-deploy"
notes = "Automated review (GPT-6) of the 0.2.0 -> 0.2.1 delta; not a person's audit: Reviewed the complete source and manifest delta and the surrounding WriteBuffer implementation. Its private length starts at zero and advances only after a checked destination slice has been filled with complete UTF-8 input. The new unchecked prefix and raw slice conversions therefore cover initialized bytes with the original lifetime and alignment; the mutable conversion follows a full copy of Copy elements. Array initialization removes an unsafe helper. The alternate formatting macro now calls the boolean alternate setter instead of width. Other changes are inline annotations, docs cfg, lints and MSRV. No build script or new I/O; the optional macro dependency requires separate coverage."

