[[exemptions.indexmap]]
version = "2.14.2"
criteria = "safe-to-deploy"
notes = "Automated review (GPT-6) of the 2.14.0 -> 2.14.2 delta; not a person's audit: Reviewed the compiled source and manifest delta against the imported audited version. Both disjoint mutable-access helpers validate all bounds and duplicate indices before deriving references from the exclusive slice pointer; no mutation occurs between checks and pointer use. Optional missing keys produce None. Bucket projections split distinct key/value fields. Index operations retain explicit checked bounds; same-key equality uses Eq. Empty-map macros use the existing safe const constructor. No new ambient I/O. Dependencies require separate coverage."

[[exemptions.itoa]]
version = "1.0.18"
criteria = "safe-to-deploy"
notes = "Automated review (Claude Opus 5.5) of version 1.0.18; not a person's audit: Read all packaged src/ files (lib.rs, u128_ext.rs) and the manifest; no build script, no_std, no default dependencies. Unsafe code is unchecked DECIMAL_PAIRS indexing, a cast of the 40-byte buffer to the sealed per-type array and from_utf8_unchecked on the written tail. Pair indices stay below 100 because every divmod100 input is below 10000, including the 1e16 split of u128, whose multiply-shift constant was checked to give an exact quotient for every u128 (M*1e16 - 2^179 < 2^51). The written region is contiguous, every write is bounds-checked, and it holds only ASCII digits and '-'. No filesystem, network, process, env, FFI or asm."

