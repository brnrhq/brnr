# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit reviews pull requests against main. AGENTS.md and CLAUDE.md are
# read as the review guidelines by default. Reference:
# https://docs.coderabbit.ai/reference/configuration
language: en-US
reviews:
  profile: chill
  # The summary goes in CodeRabbit's walkthrough comment, not the PR description.
  high_level_summary: true
  high_level_summary_in_walkthrough: true
  poem: false
  in_progress_fortune: false
  auto_review:
    enabled: true
    drafts: false
    # Stacked pull requests too, whatever their base.
    base_branches: [".*"]
  # Generated or vendored: lockfiles, cargo vet's audits, fuzz corpora.
  path_filters:
    - "!**/Cargo.lock"
    - "!adapters/bun.lock"
    - "!supply-chain/**"
    - "!fuzz/seeds/**"
  path_instructions:
    - path: "**/*.md"
      instructions: >
        The prose is compact on purpose and often elliptical ("prints a
        group's", "as Apache-2.0 asks a redistribution to"). Don't flag
        ellipsis or reword correct sentences. Flag what is wrong: a claim the
        code contradicts, a broken example, a stale command or name.
  # Doc comments here say what where it needs saying, not on every function.
  pre_merge_checks:
    docstrings:
      mode: "off"
  # Generated tests wouldn't drive the binary against tests/fake_agent.py.
  finishing_touches:
    docstrings:
      enabled: false
    unit_tests:
      enabled: false
  # CI already runs these (AGENTS.md, Checks); a second copy only repeats it.
  tools:
    clippy:
      enabled: false
    ruff:
      enabled: false
    shellcheck:
      enabled: false
    actionlint:
      enabled: false
    zizmor:
      enabled: false
chat:
  auto_reply: true
  art: false
