[package]
name = "brnr"
version = "0.12.0"
edition = "2024"
# let chains
rust-version = "1.88"
description = "A burner phone for your coding agents: run ACP agents behind a host you can talk to from outside the editor."
license = "Apache-2.0"
repository = "https://github.com/brnrhq/brnr"
homepage = "https://brnrhq.github.io/brnr/"
readme = "README.md"
keywords = ["acp", "agent", "claude", "codex", "editor"]
categories = ["command-line-utilities", "development-tools"]
# What `cargo publish` uploads (ADR 11.6): the source and what it embeds, and
# the license and NOTICE, which Apache-2.0 asks a redistribution to carry.
include = ["/src/", "/skills/", "/README.md", "/LICENSE", "/NOTICE"]

[dependencies]
# ACP's types (ADR 2.3 in docs/adr), without schemars and without the
# unstable features: its methods and types are what strict mode calls stable.
agent-client-protocol-schema = { version = "1.10.2", default-features = false }
libc = "0.2.189"
serde = { version = "1.0.229", features = ["derive"] }
# preserve_order: a prompt the host rewrites keeps the editor's key order.
# unbounded_depth: ACP lines are read however deeply they nest (src/json.rs).
serde_json = { version = "1.0.151", features = ["preserve_order", "unbounded_depth"] }
toml = "1.1.6"

[features]
# `brnr::internals`: what the crate's own tests and fuzz targets reach
# (ADR 8.5). Off for everyone else: it isn't part of the public API.
internals = []

# The integration tests are a crate of their own, so they reach `internals`
# as any crate would: through the feature, enabled here.
[dev-dependencies]
brnr = { path = ".", features = ["internals"] }

# The typed facade's tests run without libtest's harness: the facade's
# `session new` starts the process from the running program, `<program>
# host`, which the test's own `main` hands to `brnr::run` (ADR 8.5).
[[test]]
name = "facade"
harness = false

# What `brnr acp` adds (ADR 1, N3): `cargo bench --bench acp`, its budgets
# in benches/budgets.toml, run on every pull request (.github/workflows/bench.yml).
[[bench]]
name = "acp"
harness = false

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
# --cfg sanitized: built under a sanitizer (.github/workflows/sanitizers.yml),
# whose bigger stack frames src/json.rs makes room for.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(sanitized)"] }

[lints.clippy]
# Every unsafe block says why it is sound (// SAFETY: …).
undocumented_unsafe_blocks = "deny"
